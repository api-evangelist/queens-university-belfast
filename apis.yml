- aid: queens-university-belfast:datacite-repository-client
  name: Queen's University Belfast Research Portal — DataCite repository client
  description: 'Queen''s University Belfast is a DataCite consortium organization (provider jxtg) and
    has operated a registered DataCite repository client, BL.QUB, since 2015, through which the Research
    Portal mints DOIs for datasets and theses. The registration itself is machine-readable through the
    DataCite REST API, which is what makes it worth recording: it is a verifiable persistent-identifier
    commitment rather than a claim on a web page.'
