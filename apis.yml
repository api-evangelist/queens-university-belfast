aid: queens-university-belfast
name: Queen's University Belfast
description: 'Queen''s University Belfast is a public research-intensive university in Belfast, Northern
  Ireland, founded in 1845 and a member of the Russell Group. Its programmable footprint is almost entirely
  a buyer''s footprint rather than a builder''s: there is no central developer portal, no api.qub.ac.uk,
  no institutional open-data portal, and no institution-authored OpenAPI. The research surface people
  mistake for QUB engineering is an Elsevier Pure tenancy — pure.qub.ac.uk and pureadmin.qub.ac.uk both
  CNAME into eu.prod.elsevierpure.com, and the OpenAPI served there is titled "Pure API" with contact
  pure-support@elsevier.com, so the data is QUB''s and the contract is Elsevier''s. The same pattern holds
  for the VLE (Canvas at canvas.qub.ac.uk, CNAME qub-vanity.instructure.com) and library discovery (Ex
  Libris Primo at qub.primo.exlibrisgroup.com). What QUB genuinely operates and publishes in machine-readable
  form is its identity federation: a production Shibboleth SAML 2.0 Identity Provider (entityID https://qub.ac.uk/shibboleth)
  registered in the UK Access Management Federation, which also hosts federated identity for the Healthcare
  Library of Northern Ireland and AFBI. Alongside that sit a live OAI-PMH 2.0 harvesting endpoint for
  the Research Portal, a registered DataCite repository client (BL.QUB, 2015), a school-level Crossref
  membership, and the NI-HPC / Kelvin2 national high-performance computing service, whose site runs on
  QUB''s own web platform. This profile deliberately records those tenancies as relationships rather than
  as QUB''s own contracts.'
