- aid: queens-university-belfast:canvas-lms
  name: Queen's University Belfast Canvas LMS deployment (Instructure tenancy)
  description: 'The Queen''s Canvas virtual learning environment, reachable at canvas.qub.ac.uk. The Canvas
    REST API responds on the QUB hostname (an unauthenticated GET /api/v1/courses returns 401 "user authorisation
    required"), and the tenancy publishes a live LTI 1.3 platform JWKS and an OpenID Connect discovery
    document — real, machine-readable LTI conformance at a QUB address. The platform is Instructure''s:
    canvas.qub.ac.uk CNAMEs to qub-vanity.instructure.com, and web sign-in federates to Microsoft Entra
    SAML. Recorded as a tenancy; no Canvas contract is kept here.'
