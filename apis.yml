apis:
- aid: queens-university-belfast:identity-federation-idp
  name: Queen's University Belfast Shibboleth Identity Provider (UK Access Management Federation)
  description: Queen's University Belfast operates a production Shibboleth SAML 2.0 Identity Provider
    registered in the UK Access Management Federation and, through it, eduGAIN. The signed SAML entity
    descriptor is machine-readable and individually resolvable through the federation's MDQ service; it
    declares the qub.ac.uk attribute scope and SAML2 SSO, SLO, artifact-resolution and attribute-query
    endpoints on qub-shib.qub.ac.uk. QUB additionally registers IdPs for the Healthcare Library of Northern
    Ireland (honni.qub.ac.uk) and the Agri-Food and Biosciences Institute (afbi.qub.ac.uk), so it is operating
    federated identity for organisations beyond itself. This is the one machine-readable surface in this
    profile that Queen's both runs and publishes.
  humanURL: https://www.ukfederation.org.uk/
  baseURL: http://mdq.ukfederation.org.uk/entities/https%3A%2F%2Fqub.ac.uk%2Fshibboleth
  x-operator: institution
  x-operator-evidence: entityID https://qub.ac.uk/shibboleth; OrganizationDisplayName "Queen's University
    Belfast"; shibmd:Scope qub.ac.uk; SSO endpoints on qub-shib.qub.ac.uk. Probed 2026-08-30, MDQ 200
    and present in the aggregate federation metadata.
  x-entity-id: https://qub.ac.uk/shibboleth
