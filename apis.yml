- aid: queens-university-belfast:research-portal-oai
  name: Queen's University Belfast Research Portal — OAI-PMH harvesting endpoint
  description: Live OAI-PMH 2.0 metadata harvesting endpoint for the QUB Research Portal. Identify returns
    repositoryName "QUB Research Portal" with adminEmail puresupport@qub.ac.uk and an earliest datestamp
    of 2016-04-05. Six metadata formats are offered (oai_dc, qdc, mods, uketd_dc, xmetadiss, nl_didl)
    across persons and publications sets, including per-year publication sets from 1970 forward. The metadata
    described is Queen's; the repository software and the host are Elsevier Pure's, so this is recorded
    as a tenant deployment of an open protocol rather than as a QUB-authored interface.
